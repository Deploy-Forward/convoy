[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "convoy"
version = "1.4.1"
description = "Convoy: local-first multi-agent orchestration CLI and loopback MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
convoy = "convoy.cli:main"
convoy-pane-host = "convoy.pane_host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
convoy = ["harness_effort.json", "widget_page/**", "conductor.md", "assets/**"]

[project.optional-dependencies]
widget = ["pywebview>=5"]
tray = ["pywebview>=5", "pystray>=0.19", "pillow>=10"]
