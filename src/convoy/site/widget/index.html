<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>convoy</title>
<link rel="icon" href="/assets/logo.svg">
<style>
@font-face { font-family: "Work Sans"; src: url("/assets/fonts/work-sans-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("/assets/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
:root {
  --bg: linear-gradient(180deg, #1b1c21 0%, #141519 100%);
  --panel: rgba(255, 255, 255, 0.045);
  --panel-2: rgba(255, 255, 255, 0.07);
  --hair: rgba(255, 255, 255, 0.10);
  --hair-2: rgba(255, 255, 255, 0.16);
  --ink: #ececf1;
  --ink-2: #b4b8c2;
  --ink-3: #7d8290;
  --blue: #4f7cff;
  --blue-2: #1d4ed8;
  --green: #35c07a;
  --amber: #e2b23c;
  --red: #ef5a5a;
  --unknown: #565b66;
  --mono: "JetBrains Mono", Consolas, "Cascadia Mono", Menlo, monospace;
  --sans: "Work Sans", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
html, body { margin: 0; background: transparent; color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
body.opaque { background: #17181c; }
body.opaque .shell { background: linear-gradient(180deg, #1b1c21 0%, #141519 100%); }
body.glass .shell { background: rgba(18, 19, 24, 0.58); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); }
body.glass section.card { background: rgba(255, 255, 255, 0.05); }
.shell { position: relative; height: 100vh; box-sizing: border-box; border: 1px solid var(--hair-2); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; }
.drag { -webkit-app-region: drag; }
.nodrag { -webkit-app-region: no-drag; }

header { display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px; border-bottom: 1px solid var(--hair); }
header .logo { width: 30px; height: 30px; border-radius: 8px; flex: none; }
header .brand { display: flex; flex-direction: column; line-height: 1.15; }
header .word { font: 600 15px var(--mono); letter-spacing: .01em; }
header .tag { font-size: 11px; color: var(--blue); text-decoration: none; }
header .spacer { flex: 1; }
.dots { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--ink-3); }
.dot { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; padding: 3px 6px; border-radius: 8px; }
.dot:hover { background: var(--panel-2); }
.dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; box-shadow: 0 0 0 2px transparent; }
.dot.on i { background: var(--blue); }
.dot.stale i { box-shadow: 0 0 0 2px var(--red); }
.dot.on { color: var(--ink); }
.iconbtn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--hair-2); color: var(--ink-2); cursor: pointer; font: 500 13px var(--mono); }
.iconbtn:hover { background: var(--panel-2); color: var(--ink); }
.iconbtn.on { color: var(--blue); border-color: var(--blue); }

main { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
section.card { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 12px 14px; }
.eyebrow { display: flex; align-items: center; justify-content: space-between; font: 600 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; }
.eyebrow .right { color: var(--ink-3); letter-spacing: .06em; }
.chip { font: 600 10px var(--mono); letter-spacing: .12em; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; }
.chip.ok { color: var(--green); border-color: rgba(53,192,122,.35); background: rgba(53,192,122,.08); }
.chip.local { color: var(--ink-2); border-color: var(--hair-2); }
.mono { font-family: var(--mono); }
.repo .url { font: 500 13px var(--mono); color: var(--ink); word-break: break-all; }
.repo .path { font: 12px var(--mono); color: var(--ink-2); margin-top: 6px; }
.repo .meta { font: 11px var(--mono); color: var(--ink-3); margin-top: 3px; }
.repo .meta b { color: var(--ink-2); font-weight: 500; }

.seg { display: inline-flex; border: 1px solid var(--hair-2); border-radius: 8px; overflow: hidden; font: 600 10.5px var(--mono); letter-spacing: .1em; }
.seg span { padding: 4px 10px; cursor: pointer; color: var(--ink-3); }
.seg span.on { background: var(--ink); color: #111; }
.usage-row { display: grid; grid-template-columns: 74px 1fr 52px; align-items: center; gap: 12px; padding: 5px 0; font: 12.5px var(--mono); }
.bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--blue); width: 0; transition: width .5s ease; }
.bar.unknown i { background: var(--unknown); width: 100%; opacity: .55; }
.bar.probing i { background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.22), rgba(255,255,255,.06)); background-size: 200% 100%; width: 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }
.pct { text-align: right; color: var(--ink-2); }
.pct.unknown { color: var(--ink-3); }
.foot { font: 11px var(--mono); color: var(--ink-3); margin-top: 6px; }

table { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); table-layout: fixed; }
th { text-align: left; font: 600 10px var(--mono); letter-spacing: .12em; color: var(--ink-3); padding: 4px 6px 8px; border-bottom: 1px solid var(--hair); }
td { padding: 7px 6px; border-bottom: 1px solid var(--hair); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
td.chipcell { overflow: visible; }
tr.row.sel td { background: rgba(79,124,255,.14); box-shadow: inset 3px 0 0 var(--blue); }
tr.row.sel td.seat { color: #fff; }
tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--panel-2); }
tr.row.sel td { background: rgba(79,124,255,.10); }
td.seat { position: relative; padding-left: 12px; font-size: 12px; letter-spacing: -.01em; }
tr.lead td.seat::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--blue); }
.dd { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--hair-2); border-radius: 7px; color: var(--ink); max-width: 100%; }
.dd:hover { border-color: var(--blue); }
.dd.na { color: var(--ink-3); border-style: dashed; }
.dd svg { width: 9px; height: 9px; flex: none; opacity: .7; }
.st { display: inline-flex; align-items: center; gap: 6px; }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--unknown); }
.st.working i { background: var(--green); box-shadow: 0 0 0 3px rgba(53,192,122,.18); animation: pulse 1.6s ease-in-out infinite; }
.st.idle i { background: var(--amber); }
.st.stale i { background: var(--red); box-shadow: 0 0 0 3px rgba(239,90,90,.18); }
.st.gone i { background: var(--unknown); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(53,192,122,.05) } }
.nudge { font: 600 10px var(--mono); letter-spacing: .1em; padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(239,90,90,.5); color: var(--red); background: rgba(239,90,90,.08); cursor: pointer; }
.nudge:hover { background: rgba(239,90,90,.18); }

footer { padding: 6px 14px 10px; font: 11px var(--mono); color: var(--ink-3); border-top: 1px solid var(--hair); display: flex; justify-content: space-between; gap: 10px; }
footer .status { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.confirm { margin: 0 12px 10px; padding: 10px 12px; border: 1px solid rgba(239,90,90,.4); border-radius: 10px; background: rgba(239,90,90,.06); font: 12px var(--mono); display: none; }
.confirm.show { display: block; }
.confirm .cmd { color: var(--ink); white-space: pre-wrap; word-break: break-all; margin: 6px 0; }
.confirm .btns { display: flex; gap: 8px; justify-content: flex-end; }
.confirm .btns span { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--hair-2); cursor: pointer; }
.confirm .btns .go { border-color: var(--red); color: var(--red); }
.start { display: none; margin: 0 12px 10px; }
.start.show { display: block; }
.frow { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: center; margin: 6px 0; font: 12px var(--mono); }
.lbl { color: var(--ink-3); font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.in { background: rgba(255,255,255,.05); border: 1px solid var(--hair-2); color: var(--ink); border-radius: 7px; padding: 5px 8px; font: 12px var(--mono); outline: none; width: 100%; box-sizing: border-box; }
.in:focus { border-color: var(--blue); }
select.in { appearance: none; }
.hxs { display: flex; flex-wrap: wrap; gap: 6px; }
.hx { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--hair-2); border-radius: 7px; cursor: pointer; }
.hx.off { opacity: .45; cursor: not-allowed; }
.hx small { color: var(--ink-3); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { padding: 3px 8px; border: 1px solid var(--hair-2); border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.pick:hover { border-color: var(--blue); color: var(--ink); }
.seats { display: flex; flex-direction: column; gap: 6px; }
.seat-row { display: grid; grid-template-columns: 1fr 1.4fr 1fr .9fr 20px; gap: 6px; align-items: center; }
.start .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; font: 12px var(--mono); }
.start .btns span { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--hair-2); cursor: pointer; }
.start .btns .go { border-color: var(--blue); color: var(--blue); }
.empty { padding: 24px 14px; color: var(--ink-3); font: 12px var(--mono); text-align: center; }
</style>
</head>
<body>
<div class="shell">
  <header class="drag">
    <img class="logo" src="/assets/logo.svg" alt="">
    <div class="brand"><span class="word">convoy.bot</span><a class="tag nodrag" id="tag" href="#">Deploy Forward</a></div>
    <div class="spacer"></div>
    <div class="dots nodrag" id="dots"></div>
    <span class="iconbtn nodrag" id="plus" title="new thread">+</span>
    <span class="iconbtn nodrag" id="pin" title="always on top">&#9679;</span>
  </header>
  <main id="main"><div class="empty">reading the thread…</div></main>
  <div class="confirm" id="confirm"></div>
  <div class="start card" id="start"></div>
  <footer><span class="status" id="status"></span><span id="clock"></span></footer>
</div>
<script src="/widget.js"></script>
</body>
</html>
